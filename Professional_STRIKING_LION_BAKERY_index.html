<!DOCTYPE html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'>
<title>STRIKING LION BAKERY</title>
<style>
body{margin:0;font-family:Arial;background:#f7f4ef}header{background:linear-gradient(135deg,#8b4513,#d79b47);color:#fff;padding:30px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;padding:20px}
.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.1)}
img{width:100%;height:140px;object-fit:cover}h3,p{padding:0 12px}button{margin:12px;padding:10px;width:calc(100% - 24px);background:#0a7d4d;color:#fff;border:none;border-radius:10px}
</style></head><body>
<header><h1>🍞 STRIKING LION BAKERY</h1><p>Fresh Bakery • Home Delivery</p></header>
<div class='grid'>
<div class='card'><img src='https://placehold.co/400x300?text=Cake'><h3>Mawa Cake</h3><p>₹99</p><button>Add to Cart</button></div>
<div class='card'><img src='https://placehold.co/400x300?text=Cookies'><h3>Cookies</h3><p>₹66</p><button>Add to Cart</button></div>
<div class='card'><img src='https://placehold.co/400x300?text=Bread'><h3>Brown Bread</h3><p>₹42</p><button>Add to Cart</button></div>
<div class='card'><img src='https://placehold.co/400x300?text=Pastry'><h3>Pastry</h3><p>₹28</p><button>Add to Cart</button></div>
</div>
</body></html>
